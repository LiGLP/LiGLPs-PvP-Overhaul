name: release
on:
  push:
    branches-ignore:
      - 'dependabot/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: build
        run: chmod +x ./gradlew && ./gradlew build
      - name: read mod version
        id: version
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      # Creates (or updates) the release v<mod_version> with the built jar
      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: LiGLP's PvP Overhaul v${{ steps.version.outputs.version }}
          body: For Minecraft 1.21.11 (Fabric). Requires Fabric Loader 0.17.0+ and Fabric API.
          files: build/libs/liglps-pvp-overhaul-*.jar
